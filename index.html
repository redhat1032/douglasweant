:root {
  --navy: #020a14;
  --amber: #ffbe0b;
  --cyan: #00f5ff;
  --orange: #ff6a00;
  --vellum: #f4e8c1;
  --oak: #2b2117;
  --surface: var(--navy);
}

* {
  font-variant-ligatures: none;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--navy);
  color: white;
  font-family: 'JetBrains Mono', monospace;
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-thumb {
  background: rgba(255,190,11,0.3);
}

::-webkit-scrollbar-track {
  background: transparent;
}

/* scanline */

.scanline {
  background: linear-gradient(transparent 0%, rgba(0,245,255,0.07) 50%, transparent 100%);
  background-size: 100% 8px;
  animation: scan 8s linear infinite;
}

@keyframes scan {
  from {
    background-position: 0 0;
  }

  to {
    background-position: 0 100%;
  }
}

@keyframes ping {
  0% {
    transform: scale(1);
    opacity: 1;
  }

  100% {
    transform: scale(2.8);
    opacity: 0;
  }
}

@keyframes morseFlash {
  0%,100% {
    opacity: 1;
  }

  50% {
    opacity: 0.1;
  }
}

@keyframes tapeSpin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

@keyframes drift {
  0% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-6px);
  }

  100% {
    transform: translateY(0);
  }
}

@keyframes knotDash {
  to {
    stroke-dashoffset: -200;
  }
}
