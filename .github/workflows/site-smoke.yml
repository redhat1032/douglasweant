name: Static site smoke checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check site structure and entrypoints
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
